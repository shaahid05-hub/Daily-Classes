<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url('https://i.pinimg.com/736x/54/08/c5/5408c5a173c8f7c30829a14a1fdfe359.jpg');
            background-size: cover;
            /* background-repeat: no-repeat; */
            background-position: center;
        }
        .cont{
            display: flex;
            justify-content: space-evenly;
            height: 90vh;
            align-items: center;
        }
        .card{
           width: 150px;
           height: 150px;
           /* background-color: orange; */
           box-shadow: 1px 1px 1px black; 
           display: flex;
           place-items: end;
           place-content: center;
           font-size: 30px;
           cursor: pointer;
           background-size: cover;
           background-position: center;
           border-radius: 5px;
           color: orangered;
           font-weight: bolder;
           font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        
    </style>
</head>
<body>
    <div class="cont">
        <div class="card" onclick="makeSound('a')">A</div>
        <div class="card" onclick="makeSound('b')">B</div>
        <div class="card" onclick="makeSound('c')">C</div>
        <div class="card" onclick="makeSound('d')">D</div>
        <div class="card" onclick="makeSound('e')">E</div>
        <div class="card" onclick="makeSound('f')">F</div>
    </div>


    <script src="./app.js"></script>
</body>
</html>
